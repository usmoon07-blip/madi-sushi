# Bepul Render 15 daqiqa jimlikdan keyin uxlaydi. Ish vaqtida har 10 daqiqada turtki beramiz.
# UTC 04-21 = Toshkent 09:00-02:00 (oyiga ~540 soat, bepul 750 soat chegarasiga sig'adi)
name: Serverni uyg'oq tutish

on:
  schedule:
    - cron: '*/10 4-21 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping
        env:
          # Render bergan manzil (masalan https://madi-sushi.onrender.com)
          SERVER_URL: ${{ vars.SERVER_URL || 'https://madi-sushi.onrender.com' }}
        # Server hali joylanmagan bo'lsa ham xato xati yubormaslik uchun muvaffaqiyatli tugaydi
        run: |
          if curl -fsS --retry 3 --retry-delay 20 --max-time 90 "$SERVER_URL/api/health"; then
            echo " — server uyg'oq"
          else
            echo "::warning::Server javob bermadi: $SERVER_URL"
          fi
